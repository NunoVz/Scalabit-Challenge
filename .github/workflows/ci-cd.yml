name: CI/CD - PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-sec:
    name: Lint & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      # 1. Linter Go
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      # 2. SAST
      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: ./...

      # 3. SCA 
      - name: Run Trivy vulnerability scanner (SCA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      # 4. Secret Scanning
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. IaC Scanning (Infrastructure as Code)
      - name: Run Trivy for IaC (Kubernetes & Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'

  tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Run Tests
        run: go test -v -race -cover ./...

  deploy:
    name: Build & Deploy to Minikube
    needs: [lint-and-sec, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Minikube
        uses: medyagh/setup-minikube@latest

      - name: Build Docker Image (Local)
        run: docker build -t scalabit-challenge-api:latest .

      # 6. Container Image Scanning
      - name: Run Trivy vulnerability scanner (Container Image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'scalabit-challenge-api:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Load Image into Minikube
        run: minikube image load scalabit-challenge-api:latest

      - name: Create/Update Kubernetes Secret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create secret generic github-creds \
            --from-literal=GITHUB_TOKEN=${GITHUB_TOKEN} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/scalabit-challenge-api --timeout=90s || (kubectl get pods && kubectl logs -l app=scalabit-challenge-api && exit 1)

      - name: Run Smoke Tests (API Health)
        run: |
          echo "Waiting for the service to be accessible..."
          MINIKUBE_IP=$(minikube ip)
          echo "Testing route: http://$MINIKUBE_IP:30000/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 --retry-connrefused http://$MINIKUBE_IP:30000/health)
          if [ "$RESPONSE" == "200" ]; then
            echo "Smoke test passed! API is healthy and accessible externally."
          else
            echo "Smoke test failed! HTTP Status: $RESPONSE"
            exit 1
          fi